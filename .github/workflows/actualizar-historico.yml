name: Actualizar histórico de combustibles

on:
  workflow_dispatch:
  schedule:
    # Horario posterior a la ventana habitual de publicación del MEM.
    - cron: '17 22 * * *'

concurrency:
  group: actualizar-historico
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar y procesar las series
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          MEM_PROXY_URL: ${{ secrets.MEM_PROXY_URL }}
        run: |
          node scripts/tests/mem_parser.test.mjs
          node scripts/actualizar_series.mjs

      - name: Registrar cambios de datos
        run: |
          if git diff --quiet -- data/series_combustibles.json; then
            echo "No hay datos nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series_combustibles.json
          git commit -m "chore: actualizar histórico de combustibles"
          git push
